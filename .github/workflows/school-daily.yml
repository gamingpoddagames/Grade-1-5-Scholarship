name: School Daily Content (No AI)
on:
  push:
    paths:
      - 'school/daily_publisher.py'
      - 'school/facebook_card.py'
      - 'school/visual_quiz.py'
      - 'school/test_visual_quiz.py'
      - 'school/font_safety.py'
      - 'school/test_font_safety.py'
      - 'school/card-publish-request-*.txt'
      - 'school/questions.json'
      - 'school/publish-request-*.txt'
      - 'school/video-publish-request-*.txt'
      - '.github/workflows/school-daily.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Facebook if token is configured?'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: school-photo-crosspost
  cancel-in-progress: false
jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sinhala card image renderer
        run: |
          if ! test -f /usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-core; fi
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5'
      - name: Fail-closed Sinhala font and Facebook caption quality gate
        run: python -m unittest discover -s school -p 'test_font_safety.py' -v
      - name: Verify Facebook web/mobile Sinhala text normalization
        run: python -m unittest discover -s school -p 'test_social_text.py' -v
      - name: Verify picture quiz bank and same-photo selection
        run: python -m unittest discover -s school -p 'test_visual_quiz.py' -v
      - name: Validate Blogger-to-Facebook crossposting safeguards
        run: |
          python -m unittest discover -s school -p 'test_crosspost.py' -v
          python -m unittest discover -s school -p 'test_engagement_monetization.py' -v
      - name: Check Facebook configuration (without revealing secrets)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [[ -n "$FB_PAGE_ID" && -n "$FB_PAGE_ACCESS_TOKEN" ]]; then
            echo "Facebook secrets: configured (values hidden)"
          else
            echo "::warning::Facebook Page ID or token is missing; daily Facebook publishing will be skipped."
          fi
      - name: Generate original practice question
        run: python school/daily_publisher.py
      - name: Build Sinhala branded Facebook question card and optionally publish
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v27.0
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
          ADSTERRA_SPONSORED_LINK_ENABLED: ${{ vars.ADSTERRA_SPONSORED_LINK_ENABLED }}
          ADSTERRA_AGE_APPROPRIATE_REVIEWED: ${{ vars.ADSTERRA_AGE_APPROPRIATE_REVIEWED }}
          ADSTERRA_DIRECT_LINK: ${{ secrets.ADSTERRA_DIRECT_LINK }}
          RUN_EVENT: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$RUN_EVENT" == "schedule" || "$MANUAL_PUBLISH" == "true" || ( "$RUN_EVENT" == "push" && "$COMMIT_MESSAGE" == "Publish approved branded Sinhala question card now" ) ]]; then
            python school/facebook_card.py --question school/output/question.json --output school/output/facebook_card.png --caption school/output/facebook_post.txt --publish
          else
            python school/facebook_card.py --question school/output/question.json --output school/output/facebook_card.png --caption school/output/facebook_post.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: school-daily-content
          path: school/output/
          retention-days: 30
  render-quiz-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video dependencies
        run: |
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          if ! test -f /usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-core; fi
          fc-cache -f
      - name: Render Sinhala scholarship video
        run: python school/build_resources.py --video-dir school/output/video
      - uses: actions/upload-artifact@v4
        with:
          name: grade5-quiz-mp4
          path: school/output/video/grade5-quiz.mp4
          retention-days: 30
