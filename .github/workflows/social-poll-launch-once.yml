name: One-time Publish Reviewed Sinhala Poll to FB Blogger and Private YouTube
on:
  push:
    paths:
      - school/social-poll-launch-now.txt
permissions:
  contents: read
concurrency:
  group: punchi-reviewed-poll-launch-20261124
  cancel-in-progress: false
jobs:
  launch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Sinhala preview and YouTube API tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS \
            'google-api-python-client>=2.150,<3' 'google-auth>=2.32,<3'
      - name: Validate checked educational content and duplicate protection
        run: |
          python -m unittest discover -s school -p 'test_social_poll_pack.py' -v
          python -m unittest discover -s school -p 'test_youtube_poll_shorts.py' -v
          python -m unittest discover -s school -p 'test_crosspost.py' -v
          python -m unittest discover -s school -p 'test_youtube_shorts.py' -v
      - name: Publish exact checked text quiz to Blogger and Facebook Page once
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
          ADSTERRA_SPONSORED_LINK_ENABLED: ${{ vars.ADSTERRA_SPONSORED_LINK_ENABLED }}
          ADSTERRA_AGE_APPROPRIATE_REVIEWED: ${{ vars.ADSTERRA_AGE_APPROPRIATE_REVIEWED }}
          ADSTERRA_DIRECT_LINK: ${{ secrets.ADSTERRA_DIRECT_LINK }}
        run: |
          if [[ "$BLOGGER_ALLOW_PUBLICATION" == "false" ]]; then
            echo "::error::Owner has explicitly disabled Blogger publishing"
            exit 1
          fi
          python school/social_poll_pack.py --date 2026-11-24 --kind text --publish
      - name: Upload matching YouTube companion only as PRIVATE
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCQ2EM8DjUfg3WgzB8r6hYDQ
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_PUBLICATION_REVIEWED: 'false'
        run: |
          if [[ "$YOUTUBE_UPLOAD_ENABLED" != "true" || "${YOUTUBE_PRIVACY:-private}" != "private" ]]; then
            echo "::warning::Private YouTube upload disabled; leaving Blogger/Facebook content unchanged."
            exit 0
          fi
          python school/youtube_poll_shorts.py --date 2026-11-24 --kind text --upload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punchi-first-social-poll-publish-receipts
          path: |
            school/output/social-poll-pack/
            school/output/youtube-social-poll/
          retention-days: 14
