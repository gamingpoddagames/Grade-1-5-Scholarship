name: Import Supplied School Banner Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-banner-once.yml'
      - 'school/import_user_banner.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-user-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Download uploaded banner from public temporary image transport
        env:
          CANVA_THUMB: 'https://media.canva.com/v2/image-resize/format:PNG/height:76/quality:100/uri:ifs%3A%2F%2FM%2Fd5d38e1d-006b-4642-803f-30fb3b7d308e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHA0UQUI8XFlD1tmq6zySq68RWFJKM731p9k4y6EwIXw&exp=1795049088&osig=AAAAAAAAAAAAAAAAAAAAAJCNDXV9HFHjmb_98aa-oq-1ohA5jlxg0YSjmoHitfvQ&signer=media-rpc&token=AAIAAU0AJGQ1ZDM4ZTFkLTAwNmItNDY0Mi04MDNmLTMwZmIzYjdkMzA4ZQAAAAABofFDZABtYa8s0m3WFdOc2EHnvdB-EUL2kwOMdXClJG5mQaSyDQ&x-canva-quality=thumbnail'
        run: python school/import_user_banner.py
      - name: Persist exact banner in repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/user-supplied-banner.webp
          git commit -m "Add user-supplied school banner image" || true
          git push
