name: Publish Screenshot-Style Sinhala Quiz Reel
on:
  schedule:
    - cron: '15 6 * * *'
  push:
    paths:
      - 'school/quiz-video-request.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-daily-single-quiz
  cancel-in-progress: false
jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sinhala font and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS
      - name: Validate quiz generator and Sinhala cards
        run: |
          python -m compileall -q school
          python -m unittest discover -s school -p 'test_font_safety.py' -v
          python -m unittest discover -s school -p 'test_quiz_reel_renderer.py' -v
          python -m unittest discover -s school -p 'test_crosspost.py' -v
      - name: Render and publish new screenshot-style Reel
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v27.0
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
        run: python school/publish_ocean_quiz_video.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-style-sinhala-quiz-reel
          path: school/output/daily-quiz-video/
          retention-days: 14
