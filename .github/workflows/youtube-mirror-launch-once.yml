name: One-time Verify All Three Facebook Blogger Reels on Private YouTube
on:
  push:
    paths: ['school/youtube-mirror-launch-now.txt']
permissions:
  contents: read
concurrency:
  group: punchi-nena-maga-youtube-shorts
  cancel-in-progress: false
jobs:
  mirror-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: ${{ vars.YOUTUBE_UPLOAD_ENABLED == 'true' && vars.YOUTUBE_PRIVACY == 'private' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged video source and Google API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS \
            'google-api-python-client>=2.150,<3' 'google-auth>=2.32,<3'
      - name: Verify exact source and no duplicates
        run: |
          python -m unittest discover -s school -p 'test_youtube_social_mirror.py' -v
          python -m unittest discover -s school -p 'test_youtube_shorts.py' -v
      - name: Publish only missing owner-channel mirrored videos as PRIVATE
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCQ2EM8DjUfg3WgzB8r6hYDQ
          YOUTUBE_UPLOAD_ENABLED: 'true'
          YOUTUBE_PUBLICATION_REVIEWED: 'false'
        run: python school/youtube_social_mirror.py --date 2026-11-24 --upload --privacy private
      - name: Show successful and skipped mirrored videos
        if: always()
        run: |
          if [[ -f school/output/youtube-facebook-mirror/mirror-report.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          rows=json.loads(Path("school/output/youtube-facebook-mirror/mirror-report.json").read_text(encoding="utf-8"))
          print("### Existing Facebook and Blogger Reels mirrored to PRIVATE YouTube")
          for r in rows:
              print("- Slot %s: %s; %s" % (r["slot"],r["status"],r["video_url"] or "already on YouTube"))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punchi-first-three-facebook-blogger-youtube-mirrors
          path: school/output/youtube-facebook-mirror/
          retention-days: 7
