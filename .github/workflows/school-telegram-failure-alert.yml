name: School Archived Alert Script Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archived alert script without delivery
        run: python -m py_compile school/telegram_failure_alert.py
