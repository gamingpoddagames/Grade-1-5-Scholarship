name: School Telegram Workflow Failure Alerts
on:
  workflow_run:
    workflows:
      - "Punchi Nena Maga Daily Education"
      - "Blogger Auto Publisher (Google OAuth)"
      - "Publish Scholarship Website"
      - "School Daily Content (No AI)"
      - "Test Sinhala Voiceover (No Paid AI)"
      - "School Website Visitor Promotion (FB Photo and Sinhala Video)"
      - "Weekly Blogger Growth Health Check"
      - "Build Blogger Starter Kit"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alert:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate own workflow failure and notify private Telegram chat
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python -m py_compile school/telegram_failure_alert.py
            echo "Failure alert system syntax validated without sending fake alert."
          else
            python school/telegram_failure_alert.py
          fi
