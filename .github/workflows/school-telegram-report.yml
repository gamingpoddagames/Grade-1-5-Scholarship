name: School GitHub Operations Report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'school/telegram_report.py'
      - 'school/test_telegram_report.py'
      - '.github/workflows/school-telegram-report.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: school-telegram-daily-report
  cancel-in-progress: false
jobs:
  private-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private report formatting without network
        run: python -m unittest discover -s school -p 'test_telegram_report.py' -v
      - name: Generate GitHub-only operations report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python school/telegram_report.py
      - name: Save daily private report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punchi-nena-maga-telegram-report
          path: reports/daily-telegram-report.txt
          if-no-files-found: warn
          retention-days: 14
