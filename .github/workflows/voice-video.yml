name: Test Sinhala Voiceover (No Paid AI)
on:
  push:
    branches: [main]
    paths:
      - 'school/voice_video.py'
      - '.github/workflows/voice-video.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-voice-test
  cancel-in-progress: true
jobs:
  build-sinhala-voiced-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sinhala voice and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'piper-tts>=1.3,<2'
      - name: Render matching original Sinhala quiz video
        run: python school/build_resources.py --video-dir voice_output
      - name: Add free Sinhala narration
        run: python school/voice_video.py --video-dir voice_output
      - uses: actions/upload-artifact@v4
        with:
          name: sinhala-voiced-quiz-mp4
          path: voice_output/grade5-quiz-voiced.mp4
          retention-days: 30
