name: Test Sinhala Voiceover (No Paid AI)
on:
  push:
    branches: [main]
    paths:
      - 'school/voice_video.py'
      - 'school/build_resources.py'
      - 'school/font_safety.py'
      - 'school/test_font_safety.py'
      - 'school/voice-publish-request-*.txt'
      - '.github/workflows/voice-video.yml'
  schedule:
    # 04:05 UTC = 09:35 Asia/Colombo, after daily text post
    - cron: '5 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish narrated video to Facebook?
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: school-voice-test
  cancel-in-progress: true
jobs:
  build-sinhala-voiced-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sinhala voice and video dependencies
        run: |
          if ! test -f /usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf; then
            sudo apt-get install -y fonts-noto-core
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' 'piper-tts>=1.3,<2' 'gTTS==2.5.4'
      - name: Validate complete Sinhala/Latin font coverage before making/publishing video
        run: python -m unittest discover -s school -p 'test_font_safety.py' -v
      - name: Render matching original Sinhala quiz video
        run: python school/build_resources.py --video-dir voice_output
      - name: Add free Sinhala narration
        run: python school/voice_video.py --video-dir voice_output
      - name: Append Facebook Follow outro to a separate video copy
        run: python school/video_cta.py --video voice_output/grade5-quiz-voiced.mp4 --platform facebook --audience school
      - name: Publish Sinhala narrated quiz to Facebook
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Publish approved Sinhala voiced quiz video now')
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v27.0
        run: python school/facebook_video.py --video voice_output/grade5-quiz-voiced-facebook-cta.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: sinhala-voiced-quiz-mp4
          path: |
            voice_output/grade5-quiz-voiced.mp4
            voice_output/grade5-quiz-voiced-facebook-cta.mp4
          retention-days: 30
