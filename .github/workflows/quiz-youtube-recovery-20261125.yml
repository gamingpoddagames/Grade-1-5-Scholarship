name: Punchi bonus quiz YouTube recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quiz-youtube-recovery-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-photo-crosspost
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          pip install requests 'Pillow>=11,<13' 'fonttools>=4.55,<5' 'gTTS==2.5.4' google-api-python-client google-auth
          python -m unittest discover -s school -p 'test_youtube_shorts.py'
      - name: Upload only the missing YouTube companion
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_PUBLICATION_REVIEWED: ${{ vars.YOUTUBE_PUBLICATION_REVIEWED }}
        run: |
          python - <<'PY'
          import sys,os,json
          from pathlib import Path
          from datetime import date
          sys.path.insert(0,'school')
          from quiz_topics import select
          from quiz_reel_renderer import render_quiz_video
          from video_cta import append_outro
          from youtube_shorts import build_metadata,upload
          day=date(2026,11,25)
          q=select(day,offset=2)
          folder=Path('school/output/quiz-youtube-recovery')
          folder.mkdir(parents=True,exist_ok=True)
          privacy=os.getenv('YOUTUBE_PRIVACY','private').strip().lower() or 'private'
          assert os.getenv('YOUTUBE_UPLOAD_ENABLED','').strip().lower()=='true'
          assert privacy=='private' or os.getenv('YOUTUBE_PUBLICATION_REVIEWED','').strip().lower()=='true'
          meta=build_metadata(q,day,privacy=privacy,offset=2)
          old=meta['_marker']
          meta['_marker']=old+'-BONUS'
          meta['snippet']['description']=meta['snippet']['description'].replace(old,meta['_marker'])
          meta['snippet']['title']='අමතර | '+meta['snippet']['title']
          meta['snippet']['description']+='\nhttps://punchinanamaga.blogspot.com/2026/11/2026-11-25_01413423095.html\n'+meta['_marker']
          movie=render_quiz_video(q,folder)
          result=upload(append_outro(movie,'youtube','school'),meta,folder)
          print('YouTube recovery result:',result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-recovery-receipt
          path: school/output/quiz-youtube-recovery/
          if-no-files-found: warn
