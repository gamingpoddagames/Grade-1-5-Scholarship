name: Punchi publish text poll with verified sponsor placement
on:
  push:
    paths:
      - .github/workflows/poll-sponsored-20261125.yml
permissions:
  contents: read
concurrency:
  group: school-photo-crosspost
  cancel-in-progress: false
jobs:
  launch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Sinhala preview and YouTube API tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS \
            'google-api-python-client>=2.150,<3' 'google-auth>=2.32,<3'
      - name: Validate checked educational content and duplicate protection
        run: |
          python -m unittest discover -s school -p 'test_social_poll_pack.py' -v
          python -m unittest discover -s school -p 'test_youtube_poll_shorts.py' -v
          python -m unittest discover -s school -p 'test_crosspost.py' -v
          python -m unittest discover -s school -p 'test_youtube_shorts.py' -v
      - name: Publish exact checked text quiz to Blogger and Facebook Page once
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
          ADSTERRA_SPONSORED_LINK_ENABLED: ${{ vars.ADSTERRA_SPONSORED_LINK_ENABLED }}
          ADSTERRA_AGE_APPROPRIATE_REVIEWED: ${{ vars.ADSTERRA_AGE_APPROPRIATE_REVIEWED }}
          ADSTERRA_DIRECT_LINK: ${{ secrets.ADSTERRA_DIRECT_LINK }}
        run: |
          if [[ "$BLOGGER_ALLOW_PUBLICATION" == "false" ]]; then
            echo "::error::Owner has explicitly disabled Blogger publishing"
            exit 1
          fi
          python -c 'import sys; sys.path.insert(0,"school"); from engagement_monetization import get_approved_sponsor_url; print("Approved optional sponsor URL configured:", bool(get_approved_sponsor_url()))'
          python - <<'PY'
          import sys, json, html, os
          from pathlib import Path
          from datetime import date
          from urllib.request import urlopen
          sys.path.insert(0,'school')
          from social_poll_pack import build_pack, publish
          from engagement_monetization import get_approved_sponsor_url
          sponsor = get_approved_sponsor_url()
          assert sponsor, 'Sponsor configuration not ready'
          day = date(2026,11,25)
          out = Path('school/output/social-poll-pack/sponsored-text')
          q, art, caption = build_pack(day,'text',out,text_offset=2)
          url, fb_id = publish(q,art,caption,day,'text',slot='අමතර දැනුම')
          with urlopen(url,timeout=40) as response:
              page = response.read().decode('utf-8')
          verified = 'punchi-sponsored' in page and sponsor in html.unescape(page)
          (out/'publication.json').write_text(json.dumps({'blogger':url,'facebook_id':fb_id,'sponsor_verified':verified}),encoding='utf-8')
          print('Sponsor placement verified on public Blogger article:',verified)
          assert verified, 'Public sponsor placement not confirmed; reconcile existing article, do not repost'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punchi-first-social-poll-publish-receipts
          path: |
            school/output/social-poll-pack/
            school/output/youtube-social-poll/
          retention-days: 14
