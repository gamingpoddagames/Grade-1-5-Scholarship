name: Publish Approved Ocean Quiz to Facebook
on:
  push:
    paths:
      - 'school/publish-approved-ocean-quiz.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sinhala fonts and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5'
      - name: Publish approved quiz image with verified Facebook ID
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v27.0
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
        run: python school/publish_approved_quiz.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ocean-quiz-image
          path: school/output/approved-ocean-quiz.png
