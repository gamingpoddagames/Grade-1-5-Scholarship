name: Publish Scholarship Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'school/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scholarship-pages-v2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies and Sinhala fonts
        run: |
          if ! test -f /usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf; then
            sudo apt-get install -y fonts-noto-core
          fi
          python -m pip install 'weasyprint>=62,<69' 'Pillow>=11,<13' 'piper-tts>=1.3,<2'
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get install -y ffmpeg; fi
      - name: Render Sinhala logo, cover and favicon
        run: python school/brand_assets.py --output _site/assets
      - name: Copy owner-provided school hero banner
        run: |
          mkdir -p _site/assets
          cp assets/user-supplied-banner.webp _site/assets/user-supplied-banner.webp
          test -s _site/assets/user-supplied-banner.webp
      - name: Build downloadable PDF papers
        run: python school/build_resources.py --pdf-dir _site/downloads --site-dir _site
      - name: Generate parent guides and site policies
        run: python school/site_extras.py _site
      - name: Publish sample Grade 5 quiz video
        run: |
          python school/build_resources.py --video-dir _site/videos
          test -s _site/videos/grade5-quiz.mp4
      - name: Add narrated Sinhala audio for website (keep silent fallback)
        run: |
          if python school/voice_video.py --video-dir _site/videos; then
            cp _site/videos/grade5-quiz-voiced.mp4 _site/videos/grade5-quiz.mp4
            echo 'Sinhala voiced video set as website default'
          else
            echo 'Warning: narration unavailable; publishing existing silent video'
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare site and sitemap
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          printf '%s\n' 'User-agent: *' 'Allow: /' > _site/robots.txt
          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-1/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-2/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-3/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-4/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-5/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/how-to-use-papers/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-5-study-plan/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-1-4-maths-basics/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/about/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/privacy/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/terms/</loc></url>
          </urlset>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
