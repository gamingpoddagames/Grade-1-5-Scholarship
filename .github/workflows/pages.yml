name: Publish Scholarship Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'school/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scholarship-pages-v2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies and Sinhala fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install 'weasyprint>=62,<69' 'Pillow>=11,<13'
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get install -y ffmpeg; fi
      - name: Build downloadable PDF papers
        run: python school/build_resources.py --pdf-dir _site/downloads --site-dir _site
      - name: Publish sample Grade 5 quiz video
        run: |
          python school/build_resources.py --video-dir _site/videos
          test -s _site/videos/grade5-quiz.mp4
      - uses: actions/configure-pages@v5
      - name: Prepare site and sitemap
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          printf '%s\n' 'User-agent: *' 'Allow: /' > _site/robots.txt
          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-1/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-2/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-3/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-4/</loc></url>
            <url><loc>https://gamingpoddagames.github.io/Grade-1-5-Scholarship/grade-5/</loc></url>
          </urlset>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
