name: Punchi TikTok lesson recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lesson-tiktok-recovery-20261125.yml']
permissions:
  contents: write
concurrency:
  group: school-photo-crosspost
  cancel-in-progress: false
jobs:
  publish:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          pip install requests 'Pillow>=11,<13' 'fonttools>=4.55,<5' 'gTTS==2.5.4' google-api-python-client google-auth 'weasyprint>=62,<69'
          python -m unittest discover -s school -p 'test_sinhala_speech.py'
      - name: Recover TikTok lesson without duplicate Facebook or YouTube posts
        env:
          GH_TOKEN: ${{ github.token }}
          PUNCHI_BUFFER_API_KEY: ${{ secrets.PUNCHI_BUFFER_API_KEY }}
          PAPER_ARCHIVE_TOKEN: ${{ github.token }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v27.0
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_PUBLICATION_REVIEWED: ${{ vars.YOUTUBE_PUBLICATION_REVIEWED }}
        run: |
          test "$(TZ=Asia/Colombo date +%F)" = 2026-11-25
          python - <<'PY'
          import sys
          from pathlib import Path
          from datetime import date
          sys.path.insert(0, "school")
          from teaching_video import lesson, render
          from tiktok_publish import publish_movie
          day = date(2026,11,25)
          topic, subject, scenes = lesson(day)
          folder = Path("school/output/daily/lesson/render")
          movie = render(scenes, folder)
          caption = f"පුංචි නැණ මඟ | {topic} සිංහල පාඩම\nhttps://punchinanamaga.blogspot.com/2026/11/2026-11-25_01732730749.html\n#Sinhala #Education"
          print(publish_movie(movie,caption,day,"lesson",folder / "tiktok"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-publication-receipt
          path: |
            school/output/daily/lesson/receipt.json
            school/output/daily/lesson/render/teaching-video.mp4
          if-no-files-found: warn
