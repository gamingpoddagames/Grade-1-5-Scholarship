name: YouTube OAuth Readiness Check
on:
  push:
    paths:
      - 'school/youtube-shorts-request.txt'
      - 'school/youtube-auth-check-request.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check YouTube automation authorization flags
        env:
          CLIENT_ID_READY: ${{ secrets.YOUTUBE_CLIENT_ID != '' }}
          CLIENT_SECRET_READY: ${{ secrets.YOUTUBE_CLIENT_SECRET != '' }}
          REFRESH_TOKEN_READY: ${{ secrets.YOUTUBE_REFRESH_TOKEN != '' }}
          UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
        shell: bash
        run: |
          echo "## Punchi Nena Maga — YouTube authorization" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected channel: UCQ2EM8DjUfg3WgzB8r6hYDQ" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CLIENT_ID_READY" == true && "$CLIENT_SECRET_READY" == true && "$REFRESH_TOKEN_READY" == true ]]; then
            echo "Google OAuth credentials: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Google OAuth credentials: incomplete" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$UPLOAD_ENABLED" == true ]]; then
            echo "Automatic upload: enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Automatic upload: disabled (preview-only)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Upload privacy: ${PRIVACY:-private}" >> "$GITHUB_STEP_SUMMARY"
          echo "This diagnostic never uploads videos or reveals secret values." >> "$GITHUB_STEP_SUMMARY"
          echo "To finish authorization, run the owner's Windows OAuth setup wizard."
