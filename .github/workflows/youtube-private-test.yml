name: Punchi Nena Maga One-Time Private YouTube OAuth Test
on:
  push:
    paths:
      - 'school/youtube-private-test-request.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punchi-nena-maga-youtube-shorts
  cancel-in-progress: false
jobs:
  private-upload-test:
    if: ${{ vars.YOUTUBE_UPLOAD_ENABLED == 'true' && vars.YOUTUBE_PRIVACY == 'private' && vars.YOUTUBE_PUBLICATION_REVIEWED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quiz and Google API dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS \
            'google-api-python-client>=2.150,<3' 'google-auth>=2.32,<3' 'google-auth-oauthlib>=1.2,<2'
      - name: Verify quiz data and uniqueness rules
        run: |
          python -m unittest discover -s school -p 'test_youtube_shorts.py' -v
          python -m unittest discover -s school -p 'test_quiz_reel_renderer.py' -v
      - name: Upload one distinct private quiz to the exact verified channel
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCQ2EM8DjUfg3WgzB8r6hYDQ
          YOUTUBE_UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          YOUTUBE_PUBLICATION_REVIEWED: 'false'
        run: |
          python school/youtube_shorts.py --date 2026-11-24 --offset 1 --upload --privacy private
      - name: Report exact upload outcome
        if: always()
        run: |
          if [[ -f school/output/youtube-shorts/youtube-upload-receipt.json ]]; then
            echo "### Confirmed PRIVATE YouTube upload" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          receipt=json.loads(Path("school/output/youtube-shorts/youtube-upload-receipt.json").read_text(encoding="utf-8"))
          print("Verified channel: " + receipt["channel_id"])
          print("Visibility: " + receipt["privacy"])
          print("URL: " + receipt["video_url"])
          PY
          else
            echo "### Upload was NOT confirmed. Check the failed step; never retry blindly." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punchi-youtube-private-oauth-test
          path: school/output/youtube-shorts/
          retention-days: 7
