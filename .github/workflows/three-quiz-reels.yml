name: Three Sinhala Quiz Reels and Blogger Articles
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Facebook and Blogger (requires credentials and approval variable)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: school-three-reels
  cancel-in-progress: false
jobs:
  three-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video and Sinhala shaping dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core ffmpeg
          python -m pip install 'Pillow>=11,<13' 'fonttools>=4.55,<5' gTTS
          fc-cache -f
      - name: Verify Sinhala renderer and uniqueness before any publication
        run: |
          python -m compileall -q school
          python -m unittest discover -s school -p 'test_font_safety.py' -v
          python -m unittest discover -s school -p 'test_social_text.py' -v
          python -m unittest discover -s school -p 'test_quiz_reel_renderer.py' -v
          python -m unittest discover -s school -p 'test_crosspost.py' -v
      - name: Generate three distinct daily reels and optional publication
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_ALLOW_PUBLICATION: ${{ vars.BLOGGER_ALLOW_PUBLICATION }}
          RUN_EVENT: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$BLOGGER_ALLOW_PUBLICATION" != "false" && ( "$RUN_EVENT" == "schedule" || "$MANUAL_PUBLISH" == "true" ) ]]; then
            python school/three_reels.py --publish
          else
            echo "Preview only: manual preview or Blogger publication explicitly disabled"
            python school/three_reels.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-sinhala-quiz-reels
          path: school/output/three-reels/
          retention-days: 14
